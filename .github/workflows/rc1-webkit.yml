name: TravelIt WebKit mobile compatibility
on:
  pull_request:
    branches: [main]
    paths:
      - 'js/**'
      - 'css/**'
      - 'index.html'
      - 'sw.js'
      - 'tests/webkit-rc1.mjs'
      - 'tests/preview-webkit-rc1.mjs'
      - 'scripts/build-rc1-preview.mjs'
      - 'scripts/preview-qa.html'
      - 'scripts/preview-readiness.js'
      - '.github/workflows/rc1-webkit.yml'
jobs:
  safari-engine:
    # Only consolidated releases get this extra browser; avoid charging every experimental branch.
    if: startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install WebKit test runtime
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps webkit
      - name: Run mobile WebKit smoke
        run: node tests/webkit-rc1.mjs
      - name: Validate isolated RC1 preview in Safari engine
        run: node tests/preview-webkit-rc1.mjs
      - name: Retain screenshot only if WebKit smoke fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: travelit-webkit-failure
          path: |
            travelit-webkit-failure.png
            travelit-preview-webkit-failure.png
          if-no-files-found: ignore
          retention-days: 3
