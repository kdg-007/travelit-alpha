name: TravelIt Alpha source checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript modules
        run: |
          for file in js/*.js sw.js; do node --check "$file"; done
      - name: Validate consumer flows and legacy backup
        run: node --test tests/*.test.mjs
      - name: Build isolated-origin RC1 acceptance package (not deployed)
        if: startsWith(github.head_ref, 'release/')
        run: node scripts/build-rc1-preview.mjs
      - name: Verify every file in the isolated preview package
        if: startsWith(github.head_ref, 'release/')
        run: node scripts/preview-integrity.mjs artifacts/rc1-preview
      - name: Preserve RC1 preview package
        if: startsWith(github.head_ref, 'release/')
        uses: actions/upload-artifact@v4
        with:
          name: travelit-rc1-isolated-preview
          path: artifacts/rc1-preview/
          if-no-files-found: error
          retention-days: 7
