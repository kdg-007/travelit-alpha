name: TravelIt mobile browser acceptance
on:
  pull_request:
    paths:
      - 'js/**'
      - 'css/**'
      - 'index.html'
      - 'tests/*.browser.mjs'
      - 'sw.js'
      - '.github/workflows/b2-browser.yml'
jobs:
  browser:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run all browser acceptance suites (automatically discovered)
        shell: bash
        run: |
          set -euo pipefail
          suites=(tests/*.browser.mjs)
          if [[ ! -f "${suites[0]}" ]]; then
            echo "::error::No browser acceptance tests found"
            exit 1
          fi
          echo "Running ${#suites[@]} browser acceptance suites"
          for suite in "${suites[@]}"; do
            echo "::group::${suite}"
            node "${suite}"
            echo "::endgroup::"
          done
